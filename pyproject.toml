[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-unpad-rag"
version = "0.1.0"
description = "AI-Powered University Regulatory Assistant using RAG"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
